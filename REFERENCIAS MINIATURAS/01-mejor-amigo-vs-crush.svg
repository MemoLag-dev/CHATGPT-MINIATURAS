<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#d9eaf0"/>
      <stop offset="1" stop-color="#c7dfff"/>
    </linearGradient>
    <linearGradient id="locker" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7b72ff"/>
      <stop offset="1" stop-color="#4d5ee6"/>
    </linearGradient>
    <linearGradient id="pantsBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#1a4ac9"/>
      <stop offset="1" stop-color="#0b2e92"/>
    </linearGradient>
    <linearGradient id="pantsPink" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8ad0"/>
      <stop offset="1" stop-color="#ff5f96"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- lockers -->
  <g opacity="0.95">
    <rect x="0" y="0" width="470" height="900" fill="#d9d9d9" opacity="0.15"/>
    <g fill="url(#locker)">
      <rect x="0" y="0" width="35" height="180"/>
      <rect x="0" y="200" width="35" height="175"/>
      <rect x="0" y="400" width="35" height="175"/>
      <rect x="0" y="600" width="35" height="180"/>
      <rect x="45" y="0" width="35" height="180"/>
      <rect x="45" y="200" width="35" height="175"/>
      <rect x="45" y="400" width="35" height="175"/>
      <rect x="45" y="600" width="35" height="180"/>
      <rect x="90" y="0" width="35" height="180"/>
      <rect x="90" y="200" width="35" height="175"/>
      <rect x="90" y="400" width="35" height="175"/>
      <rect x="90" y="600" width="35" height="180"/>
    </g>
  </g>

  <g filter="url(#shadow)">
