  <!-- labels -->
  <g font-family="Arial Black, Arial, sans-serif" fill="#fff" font-weight="900" text-anchor="middle">
    <text x="250" y="125" font-size="68" fill="#ff2d2d">Mejor Amigo</text>
    <text x="250" y="210" font-size="110" fill="#fff">-12%</text>
    <text x="1230" y="125" font-size="68" fill="#42ff7d">Crush</text>
    <text x="1230" y="210" font-size="110" fill="#fff">91%</text>
  </g>

</svg>
