    <g transform="translate(130,90)">
      <rect x="120" y="90" width="240" height="250" rx="50" fill="#e7d7b3"/>
      <circle cx="240" cy="150" r="110" fill="#f5d7a8"/>
      <path d="M145 130 Q180 40 235 60 Q268 70 290 130 L310 200 Q248 160 170 198 Z" fill="#d99a5a"/>
      <path d="M150 110 Q120 60 105 125 L130 155 Q160 140 170 113 Z" fill="#d99a5a"/>
      <path d="M330 110 Q355 60 375 135 L350 155 Q318 140 310 114 Z" fill="#d99a5a"/>
      <circle cx="195" cy="165" r="12" fill="#1c1c1c"/>
      <circle cx="288" cy="165" r="12" fill="#1c1c1c"/>
      <path d="M210 205 Q240 235 271 205" stroke="#1c1c1c" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M135 250 Q240 335 345 250" fill="#f5d7a8"/>
      <rect x="150" y="330" width="200" height="160" rx="20" fill="#0d5ad4"/>
      <path d="M145 345 L340 345 L260 430 L170 430 Z" fill="#0d5ad4"/>
      <path d="M160 490 Q240 520 320 490 L320 620 L160 620 Z" fill="#0d5ad4"/>
      <path d="M170 630 Q240 670 310 630 L310 760 L170 760 Z" fill="#0d5ad4"/>
      <path d="M190 340 L160 505" stroke="#f5d7a8" stroke-width="12" stroke-linecap="round"/>
      <path d="M290 340 L320 505" stroke="#f5d7a8" stroke-width="12" stroke-linecap="round"/>
      <path d="M130 270 Q150 290 160 320" stroke="#d99a5a" stroke-width="8" fill="none"/>
      <path d="M350 270 Q330 290 320 320" stroke="#d99a5a" stroke-width="8" fill="none"/>
      <path d="M180 160 L215 150" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M260 150 L295 160" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- center character -->
    <g transform="translate(560,90)">
      <rect x="90" y="60" width="310" height="570" rx="50" fill="#f4d72c"/>
      <circle cx="245" cy="180" r="150" fill="#f1d649"/>
      <path d="M160 160 Q245 90 330 160" fill="#e4c23d"/>
      <circle cx="195" cy="220" r="20" fill="#1a1a1a"/>
      <circle cx="295" cy="220" r="20" fill="#1a1a1a"/>
      <path d="M210 260 Q245 325 280 260" stroke="#1a1a1a" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M170 165 Q145 130 120 170" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M320 165 Q345 130 370 170" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>
      <rect x="100" y="330" width="280" height="200" rx="32" fill="#f4d72c"/>
      <path d="M185 425 L175 540 L245 540 L235 425 Z" fill="#f4d72c"/>
      <path d="M255 425 L265 540 L335 540 L325 425 Z" fill="#f4d72c"/>
      <rect x="180" y="440" width="90" height="110" rx="16" fill="#f4d72c"/>
      <rect x="245" y="440" width="90" height="110" rx="16" fill="#f4d72c"/>
      <path d="M160 520 L210 545 L240 520" stroke="#f4d72c" stroke-width="16" fill="none" stroke-linecap="round"/>
    </g>

    <!-- right character -->
    <g transform="translate(1010,90)">
      <rect x="90" y="80" width="300" height="470" rx="50" fill="#f2d8ef"/>
      <circle cx="240" cy="180" r="145" fill="#f0d6ff"/>
      <path d="M120 180 Q155 45 240 45 Q328 48 360 170 Q330 165 300 150 Q250 125 200 140 Q160 155 120 180 Z" fill="#a661ff"/>
      <path d="M120 170 C160 140 200 120 240 120 C285 120 320 148 360 170" fill="none" stroke="#a461fd" stroke-width="16" stroke-linecap="round"/>
      <circle cx="188" cy="200" r="18" fill="#202020"/>
      <circle cx="292" cy="200" r="18" fill="#202020"/>
      <path d="M200 255 Q240 290 280 255" stroke="#202020" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="120" y="310" width="240" height="180" rx="28" fill="#ff96b0"/>
      <path d="M120 320 L170 380 L220 320 Z" fill="#ff96b0"/>
      <path d="M260 320 L300 380 L360 320 Z" fill="#ff96b0"/>
      <path d="M120 430 Q240 500 360 430 L360 590 L120 590 Z" fill="#ff96b0"/>
      <path d="M200 430 L165 500 L230 500 L250 435 Z" fill="#ff96b0"/>
      <path d="M280 430 L315 500 L350 500 L330 435 Z" fill="#ff96b0"/>
      <path d="M170 420 Q240 470 310 420" stroke="#f0f0f0" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
